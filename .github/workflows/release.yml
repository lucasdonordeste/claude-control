name: Release

# Publishes to Open VSX and the VS Code Marketplace when a v* tag is pushed.
# Requires the repo secrets OVSX_PAT (Open VSX token) and VSCE_PAT (Azure DevOps
# PAT with the Marketplace > Manage scope). Each publish step is skipped if its
# secret is absent, so the workflow never fails just because one is unset.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish claude-control.vsix -p "$OVSX_PAT"

      # The two registries carry different identities, and they have to.
      # `claude-control` / "Claude Control" were permanently reserved for this
      # publisher by the Marketplace after an old hard-unpublish, so that
      # registry can only ever accept the `-panel` identity. package.json keeps
      # the Open VSX identity (published above); we swap it just for this step.
      #
      # This also uses the repackage flow rather than `--packagePath`: passing a
      # prebuilt .vsix to `vsce publish` fails authentication with TF400813.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("package.json", "utf8"));
            j.name = "claude-control-panel";
            j.displayName = "Claude Control Panel";
            fs.writeFileSync("package.json", JSON.stringify(j, null, 2) + "\n");
          '
          npx @vscode/vsce publish -p "$VSCE_PAT"
          git checkout -- package.json
      - name: Note skipped registries
        if: ${{ env.OVSX_PAT == '' || env.VSCE_PAT == '' }}
        run: |
          [ -z "$OVSX_PAT" ] && echo "OVSX_PAT not set — skipped Open VSX publish."
          [ -z "$VSCE_PAT" ] && echo "VSCE_PAT not set — skipped VS Code Marketplace publish."
          echo "The .vsix was still built and verified."
